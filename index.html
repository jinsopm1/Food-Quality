<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173d35"><meta name="description" content="Manual técnico interactivo de control y aseguramiento de calidad alimentaria.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png">
<title>Food Quality</title>
<style>
:root{--green:#173d35;--green2:#24594d;--cream:#f4f2eb;--ink:#1d2925;--muted:#66736d;--line:#dfe5df;--white:#fff;--gold:#d4a94e;--soft:#e9efeb}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;background:#fbfbf8;padding-bottom:82px}.top{background:var(--green);color:#fff;padding:22px 20px 24px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border:1px solid #91b2a3;border-radius:13px;display:grid;place-items:center;font-size:22px}.brand small{display:block;color:#c8d9d1;font-size:11px;letter-spacing:.11em;text-transform:uppercase}.brand strong{font-size:21px;letter-spacing:.02em}.top p{color:#d6e4dd;margin:15px 0 13px}.search{width:100%;padding:13px 15px;border:0;border-radius:12px;background:#fff;color:var(--ink);outline:none}.content{padding:20px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--green2);text-transform:uppercase}.section-head{display:flex;justify-content:space-between;align-items:end;margin:4px 0 12px}.section-head h2{margin:0;font-size:20px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile,.panel,.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.tile{min-height:112px;text-align:left;color:var(--ink)}.tile .ico{font-size:23px;display:block;margin-bottom:8px}.tile strong{display:block}.tile small{color:var(--muted)}.panel{margin:12px 0}.item{margin:9px 0}.item h3{margin:0 0 4px;font-size:16px}.item p{margin:0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;background:var(--green);color:white;padding:11px 14px;font-weight:650}.btn.secondary{background:var(--soft);color:var(--green)}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.result{background:#edf3ee;border-radius:12px;padding:14px;margin-top:12px}.result strong{font-size:24px;color:var(--green)}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5}.tabs button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px}.tabs button span{display:block;font-size:19px}.tabs button.active{color:var(--green);font-weight:750}.back{border:0;background:transparent;color:var(--green);font-weight:700;padding:5px 0 12px}.tag{display:inline-block;background:var(--soft);color:var(--green);border-radius:30px;padding:3px 9px;font-size:11px;font-weight:700}.note{font-size:12px;color:var(--muted)}.hidden{display:none!important}ul{padding-left:20px}li{margin:6px 0} .source{border-left:3px solid var(--gold);padding:9px 12px;background:#faf7ef;font-size:13px;margin:12px 0}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">⚗</div><div><small>Manual técnico interactivo</small><strong>FOOD QUALITY</strong></div></div><p>Control y aseguramiento de calidad en la industria alimentaria.</p><input id="search" class="search" placeholder="Buscar análisis, proceso o parámetro…" aria-label="Buscar"></header>
<main id="view" class="content"></main>
<nav class="tabs"><button data-tab="home" class="active"><span>⌂</span>Inicio</button><button data-tab="library"><span>▤</span>Biblioteca</button><button data-tab="tools"><span>⌗</span>Calculadoras</button><button data-tab="records"><span>▣</span>Registros</button></nav>
</div>
<script>
const view=document.getElementById('view');let current='home';const recordsKey='fq_records_v1';const sanitationKey='fq_sanitation_v1';
const topics=[
{id:'ph',title:'Determinación de pH',cat:'Laboratorio',desc:'Medición potenciométrica con electrodo y soluciones tampón.',body:`<h3>Principio</h3><p>El pH expresa el logaritmo negativo de la actividad de los iones hidrógeno. Se mide con un electrodo apropiado y un potenciómetro.</p><h3>Procedimiento básico</h3><ol><li>Inspeccionar el electrodo y verificar los tampones.</li><li>Calibrar con soluciones apropiadas para el intervalo de trabajo (por ejemplo pH 4 y 7 para matrices ácidas).</li><li>Homogeneizar la muestra.</li><li>Introducir el electrodo, esperar estabilidad y registrar pH y temperatura.</li><li>Enjuagar y almacenar según el fabricante.</li></ol><div class="source"><b>Control:</b> la verificación diaria no sustituye una calibración trazable. No almacenar el electrodo convencional en agua destilada salvo indicación del fabricante.</div>`},
{id:'brix',title:'Sólidos solubles (°Brix)',cat:'Laboratorio',desc:'Lectura refractométrica y sus limitaciones en matrices complejas.',body:`<h3>Principio</h3><p>El refractómetro mide el índice de refracción y lo expresa como concentración equivalente de sacarosa en soluciones de referencia.</p><h3>Procedimiento básico</h3><ol><li>Limpiar el prisma.</li><li>Verificar el cero y comprobar con patrón de sacarosa adecuado.</li><li>Homogeneizar y colocar la muestra.</li><li>Registrar °Brix y temperatura.</li><li>Limpiar el prisma tras la lectura.</li></ol><div class="source"><b>Precaución:</b> en kombucha y cerveza, alcohol y otros componentes afectan la lectura. No equivale directamente a azúcar residual.</div>`},
{id:'acid',title:'Acidez titulable',cat:'Laboratorio',desc:'Neutralización con solución alcalina de concentración conocida.',body:`<h3>Principio</h3><p>Cuantifica la cantidad de base necesaria para neutralizar los componentes ácidos de la muestra hasta un punto final definido.</p><h3>Fórmula para muestra pesada</h3><p>% acidez = (V × N × Peq × 100) / (m × 1000)</p><p>V: mL de NaOH; N: equivalentes/L; Peq: g/equivalente del ácido de referencia; m: masa de muestra en g.</p><div class="source"><b>Importante:</b> declarar si el resultado se expresa como ácido cítrico, láctico, acético u otro. Utilizar concentración real estandarizada del titulante.</div>`},
{id:'moisture',title:'Humedad gravimétrica',cat:'Laboratorio',desc:'Pérdida de masa bajo condiciones controladas de secado.',body:`<h3>Principio</h3><p>Se determina la pérdida de masa tras secar la muestra bajo condiciones definidas por el método aplicable.</p><h3>Fórmula</h3><p>% humedad = [(masa inicial de muestra − masa seca) / masa inicial de muestra] × 100</p><div class="source"><b>Precaución:</b> la pérdida de masa puede incluir sustancias volátiles distintas del agua. Temperatura y tiempo dependen de la matriz y del método.</div>`},
{id:'density',title:'Densidad',cat:'Laboratorio',desc:'Relación entre masa y volumen a temperatura registrada.',body:`<h3>Principio</h3><p>ρ = m / V. Se determina con material volumétrico calibrado, densímetro o equipo digital.</p><p>Registrar siempre la temperatura. Comparar con especificaciones referidas a la misma temperatura o aplicar la corrección establecida por el método.</p>`},
{id:'calibration',title:'Verificación de equipos',cat:'Metrología',desc:'Comprobaciones rutinarias de instrumentos de medición.',body:`<h3>Conceptos</h3><ul><li><b>Calibración:</b> establece la relación entre indicaciones y valores de referencia, con sus incertidumbres.</li><li><b>Verificación:</b> aporta evidencia de que se cumplen requisitos especificados.</li><li><b>Ajuste:</b> intervención para que el instrumento indique valores prescritos.</li></ul><p>Registrar equipo, código, fecha, patrón, resultado, criterio, responsable y acciones ante desviaciones.</p>`},
{id:'nonconformity',title:'Gestión de no conformidades',cat:'Aseguramiento',desc:'Retención, investigación, disposición y acción correctiva.',body:`<ol><li>Identificar y retener el lote cuando corresponda.</li><li>Confirmar validez del resultado y estado del equipo.</li><li>Investigar causa y evaluar el riesgo.</li><li>Definir disposición autorizada del producto.</li><li>Implementar acción correctiva.</li><li>Verificar eficacia y cerrar con registros.</li></ol>`}
,
{id:'cleaning',title:'Limpieza y desinfección de equipos',cat:'Saneamiento',desc:'Selección, preparación y control de soluciones de limpieza y desinfección.',body:`<h3>Diferencia entre limpieza y desinfección</h3><p>La limpieza elimina suciedad y residuos; la desinfección reduce microorganismos mediante un agente autorizado y bajo condiciones definidas.</p><h3>Antes de preparar una solución</h3><ol><li>Identificar el producto y comprobar que es apto para el uso previsto y superficies en contacto con alimentos.</li><li>Leer etiqueta, ficha técnica y ficha de datos de seguridad.</li><li>Confirmar concentración del producto y base de expresión (por ejemplo, % m/v, % m/m o cloro disponible).</li><li>Identificar concentración objetivo, volumen final, tiempo de contacto, temperatura y necesidad de enjuague.</li><li>Usar EPP y preparar la solución en un área ventilada.</li><li>Rotular recipiente con producto, concentración, fecha/hora y responsable.</li><li>Verificar concentración con el método o tira reactiva compatible cuando corresponda.</li></ol><div class="source"><b>Seguridad:</b> nunca mezclar hipoclorito con ácidos, amoníaco u otros limpiadores. Puede liberar gases tóxicos. No aplicar una concentración genérica: seguir la etiqueta y las instrucciones del fabricante.</div><h3>Secuencia general</h3><p>Retirar residuos → pre-enjuagar si corresponde → aplicar detergente → acción mecánica → enjuagar según etiqueta → aplicar desinfectante a la concentración y tiempo establecidos → enjuagar si la etiqueta lo exige → secar/proteger.</p><p>La secuencia exacta depende del producto químico, equipo, suciedad, diseño higiénico y programa SSOP/POES.</p>`}
]; 
function home(){return `<div class="section-head"><div><div class="eyebrow">Panel principal</div><h2>Bienvenido a Food Quality</h2></div><span class="tag">Prototipo 0.3</span></div><p class="muted">Una base de consulta para aprender, ejecutar y documentar controles de calidad alimentaria.</p><div class="grid"><button class="tile" onclick="openTab('library')"><span class="ico">📚</span><strong>Biblioteca técnica</strong><small>Procedimientos y fundamentos</small></button><button class="tile" onclick="openTab('industries')"><span class="ico">🏭</span><strong>Industrias</strong><small>Procesos por categoría</small></button><button class="tile" onclick="openTab('tools')"><span class="ico">🧮</span><strong>Calculadoras</strong><small>Cálculos de laboratorio</small></button><button class="tile" onclick="openTab('records')"><span class="ico">📝</span><strong>Registros</strong><small>Historial local de análisis</small></button><button class="tile" onclick="showTopic('cleaning')"><span class="ico">🧴</span><strong>Limpieza y desinfección</strong><small>Preparación de soluciones</small></button></div><div class="panel"><div class="eyebrow">Criterio técnico</div><h3>No todos los límites son iguales</h3><p class="muted">La aplicación distinguirá requisitos legales, normas técnicas aplicables, especificaciones internas, límites de alerta y límites críticos HACCP. No se incorporarán valores sin fuente y alcance definidos.</p></div><div class="panel"><b>Próximo contenido</b><p class="muted">Completar procedimientos analíticos, después desarrollar las matrices normativas por producto e industria.</p></div>`}
function library(){return `<div class="eyebrow">Consulta</div><h2>Biblioteca técnica</h2><p class="muted">Procedimientos disponibles en este prototipo.</p>${topics.map(t=>`<button class="item" style="width:100%;text-align:left" onclick="showTopic('${t.id}')"><span class="tag">${t.cat}</span><h3>${t.title}</h3><p>${t.desc}</p></button>`).join('')}`}
function showTopic(id){const t=topics.find(x=>x.id===id);view.innerHTML=`<button class="back" onclick="openTab('library')">← Biblioteca</button><span class="tag">${t.cat}</span><h2>${t.title}</h2><p class="muted">${t.desc}</p><div class="panel">${t.body}</div><p class="note">Ficha introductoria. Antes de usarla como método oficial, confirmar método normalizado, matriz, edición vigente y alcance.</p>`;window.scrollTo(0,0)}
function industries(){let arr=[['Lácteos','Leche cruda y procesada, yogur, queso, crema y mantequilla.'],['Cárnicos','Carnes frescas, embutidos, productos cocidos y curados.'],['Frutas y pulpas','Recepción, selección, despulpado y conservación.'],['Jugos y bebidas','Jugos, néctares, bebidas y jarabes.'],['Mermeladas y conservas','Productos concentrados, acidificados y esterilizados.'],['Fermentados','Kombucha, kéfir, cerveza y fermentados de frutas.'],['Panificación y cereales','Harinas, masas, panes y productos horneados.'],['Aceites y emulsiones','Aceites, grasas, mayonesas y aderezos.']];return `<div class="eyebrow">Procesos productivos</div><h2>Industrias alimentarias</h2><p class="muted">Estructura prevista para desarrollar cada sector.</p>${arr.map(x=>`<div class="item"><h3>${x[0]}</h3><p>${x[1]}</p><span class="tag">En desarrollo</span></div>`).join('')}`}
function tools(){return `<div class="eyebrow">Herramientas</div><h2>Calculadoras</h2><p class="muted">Resultados matemáticos. Confirme la base de concentración, método y especificación antes de preparar o liberar una solución.</p>
<div class="panel"><h3>Acidez titulable (% m/m)</h3><div class="field"><label>Volumen de NaOH (mL)</label><input id="v" type="number" step="any" value="8"></div><div class="field"><label>Normalidad de NaOH (eq/L)</label><input id="n" type="number" step="any" value="0.1"></div><div class="field"><label>Peso equivalente del ácido (g/eq)</label><input id="peq" type="number" step="any" value="64.04"></div><div class="field"><label>Masa de muestra (g)</label><input id="m" type="number" step="any" value="10"></div><button class="btn" onclick="calcAcid()">Calcular</button><div id="acidres" class="result hidden"></div><p class="note">Para ácido cítrico anhidro, Peq = 64,04 g/eq. Usar la normalidad real estandarizada.</p></div>
<div class="panel"><h3>Humedad gravimétrica (%)</h3><div class="field"><label>Masa de cápsula vacía (g)</label><input id="tare" type="number" step="any" value="30"></div><div class="field"><label>Cápsula + muestra húmeda (g)</label><input id="wet" type="number" step="any" value="35"></div><div class="field"><label>Cápsula + muestra seca (g)</label><input id="dry" type="number" step="any" value="34.2"></div><button class="btn" onclick="calcMoist()">Calcular</button><div id="moistres" class="result hidden"></div></div>
<div class="panel"><h3>Densidad</h3><div class="field"><label>Masa de muestra (g)</label><input id="mass" type="number" step="any" value="103.2"></div><div class="field"><label>Volumen (mL)</label><input id="vol" type="number" step="any" value="100"></div><button class="btn" onclick="calcDensity()">Calcular</button><div id="densres" class="result hidden"></div></div>
<div class="panel"><div class="eyebrow">Saneamiento · Calculadora 1</div><h3>Dilución de producto líquido</h3><p class="muted">Para diluir un concentrado líquido cuando concentración inicial y objetivo están expresadas en la misma base y unidad. Fórmula: C₁ × V₁ = C₂ × V₂.</p><div class="field"><label>Concentración del producto concentrado</label><input id="stockConc" type="number" min="0" step="any" value="5"></div><div class="field"><label>Unidad (misma para ambas concentraciones)</label><select id="concUnit"><option value="percent">% m/v</option><option value="gL">g/L</option><option value="mgL">mg/L</option><option value="ppm">ppm (aprox. mg/L en agua diluida)</option></select></div><div class="field"><label>Concentración objetivo</label><input id="targetConc" type="number" min="0" step="any" value="200"></div><div class="field"><label>Volumen final de solución (L)</label><input id="finalVol" type="number" min="0" step="any" value="10"></div><div class="field"><label>Nombre del producto / activo</label><input id="chemName" placeholder="Ej. cloro disponible, ácido peracético"></div><button class="btn" onclick="calcDilution()">Calcular volumen de concentrado</button><div id="dilutionRes" class="result hidden"></div><p class="note">En % m/v: 1 % = 10 g/L = 10.000 mg/L. Esta calculadora no convierte % m/m a % m/v. Para eso se necesita densidad y confirmar la sustancia expresada en la etiqueta.</p></div>
<div class="panel"><div class="eyebrow">Saneamiento · Calculadora 2</div><h3>Preparación desde producto sólido</h3><p class="muted">Calcula la masa de sustancia necesaria para preparar una solución desde un reactivo sólido, suponiendo pureza conocida.</p><div class="field"><label>Concentración objetivo</label><input id="solidTarget" type="number" min="0" step="any" value="2"></div><div class="field"><label>Unidad de concentración</label><select id="solidUnit"><option value="gL">g/L</option><option value="mgL">mg/L</option><option value="percent">% m/v</option></select></div><div class="field"><label>Volumen final (L)</label><input id="solidVolume" type="number" min="0" step="any" value="10"></div><div class="field"><label>Pureza del reactivo (%)</label><input id="solidPurity" type="number" min="0.01" max="100" step="any" value="100"></div><button class="btn" onclick="calcSolid()">Calcular masa de sólido</button><div id="solidRes" class="result hidden"></div><p class="note">La pureza debe corresponder al certificado o etiqueta del reactivo. Preparar hasta el volumen final, no añadir el sólido a todo el volumen de agua.</p></div>
<div class="panel"><div class="eyebrow">Saneamiento · Calculadora 3</div><h3>Dilución por porcentaje masa/masa (% m/m)</h3><p class="muted">Úsela cuando la etiqueta y la especificación estén expresadas en % m/m. Se requiere masa final de solución, no solo volumen.</p><div class="field"><label>Concentración del producto concentrado (% m/m)</label><input id="stockMM" type="number" min="0" step="any" value="12"></div><div class="field"><label>Concentración objetivo (% m/m)</label><input id="targetMM" type="number" min="0" step="any" value="1"></div><div class="field"><label>Masa final de solución (g)</label><input id="finalMassMM" type="number" min="0" step="any" value="1000"></div><div class="field"><label>Densidad del concentrado (g/mL), opcional</label><input id="densityMM" type="number" min="0" step="any" placeholder="Solo si desea convertir a mL"></div><button class="btn" onclick="calcMassFraction()">Calcular cantidades</button><div id="massMMRes" class="result hidden"></div><p class="note">Balance teórico de masa, suponiendo que la concentración se refiere a la misma sustancia activa. Si el fabricante expresa el contenido como hipoclorito de sodio, cloro disponible u otra especie, no intercambie esas bases.</p></div>
<div class="source"><b>Seguridad y uso:</b> no se establecen dosis universales. Confirmar que el producto sea apto/indicado para la superficie y uso previsto en industria alimentaria. Respetar etiqueta, ficha técnica, concentración, tiempo de contacto, temperatura, EPP y necesidad de enjuague. Nunca mezclar hipoclorito con ácidos, amoníaco u otros limpiadores. Verificar concentración con método compatible cuando corresponda.</div>`}
function calcDilution(){let c1=Number(document.getElementById('stockConc').value),c2=Number(document.getElementById('targetConc').value),vf=Number(document.getElementById('finalVol').value),unit=document.getElementById('concUnit').value,name=document.getElementById('chemName').value.trim();if(!(c1>0&&c2>0&&vf>0)){alert('Ingrese concentraciones y volumen mayores que cero.');return}let factor=unit==='percent'?10000:unit==='gL'?1000:1;let stock=c1*factor,target=c2*factor;if(target>=stock){alert('La concentración objetivo debe ser menor que la concentración del concentrado. Revise unidades y datos.');return}let ml=(target*vf/stock)*1000;let label=unit==='percent'?'% m/v':unit==='gL'?'g/L':unit==='mgL'?'mg/L':'ppm ≈ mg/L';let r=document.getElementById('dilutionRes');r.classList.remove('hidden');r.innerHTML=`<strong>${ml.toFixed(2)} mL</strong><div>de producto concentrado${name?' ('+esc(name)+')':''}.</div><p>Medir el concentrado y agregar agua hasta alcanzar un <b>volumen final de ${vf.toLocaleString('es-EC')} L</b>.</p><p class="note">Cálculo con C₁ = ${c1} ${label} y C₂ = ${c2} ${label}. Resultado matemático; no valida eficacia ni sustituye las instrucciones del fabricante.</p>`}
function calcSolid(){let c=Number(document.getElementById('solidTarget').value),v=Number(document.getElementById('solidVolume').value),pur=Number(document.getElementById('solidPurity').value),u=document.getElementById('solidUnit').value;if(!(c>0&&v>0&&pur>0&&pur<=100))return alert('Revise concentración, volumen y pureza (mayor que 0 y hasta 100 %).');let grams=(u==='percent'?c*10*v:u==='gL'?c*v:c*v/1000)/(pur/100);let label=u==='percent'?'% m/v':u==='gL'?'g/L':'mg/L';let r=document.getElementById('solidRes');r.classList.remove('hidden');r.innerHTML=`<strong>${grams.toFixed(3)} g</strong><div>de reactivo sólido, corregido por pureza.</div><p>Disolver y completar hasta un volumen final de ${v} L.</p><p class="note">Concentración objetivo: ${c} ${label}; pureza declarada: ${pur} %.</p>`}
function calcMassFraction(){let c1=Number(document.getElementById('stockMM').value),c2=Number(document.getElementById('targetMM').value),mf=Number(document.getElementById('finalMassMM').value),rho=Number(document.getElementById('densityMM').value);if(!(c1>0&&c2>0&&mf>0&&c2<c1&&c1<=100&&c2<=100))return alert('Revise los datos: la concentración objetivo debe ser menor que la inicial y ambas deben estar entre 0 y 100 %.');let mstock=c2/c1*mf,mdiluent=mf-mstock;let r=document.getElementById('massMMRes');r.classList.remove('hidden');r.innerHTML=`<strong>${mstock.toFixed(2)} g</strong><div>de producto concentrado.</div><p>Agregar <b>${mdiluent.toFixed(2)} g</b> de diluyente para obtener ${mf.toFixed(2)} g de solución final.</p>${rho>0?`<p>Volumen aproximado de concentrado: ${(mstock/rho).toFixed(2)} mL (usando densidad ${rho} g/mL).</p>`:'<p>Ingrese densidad del concentrado si necesita convertir su masa a volumen.</p>'}<p class="note">Balance de masa teórico para concentraciones % m/m.</p>`}
function calcAcid(){let v=+document.getElementById('v').value,n=+document.getElementById('n').value,p=+document.getElementById('peq').value,m=+document.getElementById('m').value;if(v<=0||n<=0||p<=0||m<=0)return alert('Ingrese valores mayores que cero.');let r=v*n*p*100/(m*1000);showRes('acidres',r.toFixed(3)+' %','Expresada como el ácido de referencia indicado.');}
function calcMoist(){let t=+document.getElementById('tare').value,w=+document.getElementById('wet').value,d=+document.getElementById('dry').value;if(w<=t||d<t||d>w)return alert('Revise las masas ingresadas.');let r=(w-d)/(w-t)*100;showRes('moistres',r.toFixed(2)+' %','Humedad operacional por pérdida de masa.');}
function calcDensity(){let a=+document.getElementById('mass').value,b=+document.getElementById('vol').value;if(a<=0||b<=0)return alert('Ingrese valores mayores que cero.');showRes('densres',(a/b).toFixed(4)+' g/mL','Registrar la temperatura de medición.');}
function showRes(id,val,sub){let el=document.getElementById(id);el.classList.remove('hidden');el.innerHTML=`<strong>${val}</strong><div>${sub}</div>`}
function records(){let data=JSON.parse(localStorage.getItem(recordsKey)||'[]');let san=JSON.parse(localStorage.getItem(sanitationKey)||'[]');return `<div class="eyebrow">Bitácora personal</div><h2>Registros</h2><p class="muted">Los datos se guardan localmente en este dispositivo/navegador.</p><div class="panel"><h3>Registro de análisis</h3><div class="field"><label>Producto / muestra</label><input id="sample" placeholder="Ej. Pulpa de mora"></div><div class="field"><label>Lote</label><input id="lot" placeholder="Código de lote"></div><div class="field"><label>Parámetro</label><select id="param"><option>pH</option><option>°Brix aparente</option><option>Acidez titulable</option><option>Humedad</option><option>Densidad</option></select></div><div class="field"><label>Resultado</label><input id="value" placeholder="Valor y unidad"></div><div class="field"><label>Observaciones</label><textarea id="obs" rows="2" placeholder="Método, temperatura, equipo…"></textarea></div><button class="btn" onclick="saveRecord()">Guardar análisis</button></div>
<div class="panel"><h3>Registro de limpieza y desinfección</h3><div class="field"><label>Área, equipo o instrumento</label><input id="sanEquipment" placeholder="Ej. tanque de mezcla, mesa, pH-metro (superficie externa)"></div><div class="field"><label>Tipo de operación</label><select id="sanType"><option>Limpieza</option><option>Desinfección</option><option>Limpieza y desinfección</option></select></div><div class="field"><label>Producto químico / marca</label><input id="sanProduct" placeholder="Nombre comercial y sustancia activa"></div><div class="field"><label>Lote del producto químico</label><input id="sanLot" placeholder="Lote / vencimiento"></div><div class="field"><label>Concentración preparada y unidad</label><input id="sanConc" placeholder="Ej. 150 mg/L de cloro disponible"></div><div class="field"><label>Cantidad preparada</label><input id="sanQty" placeholder="Ej. 10 L"></div><div class="field"><label>Tiempo de contacto</label><input id="sanTime" placeholder="Según etiqueta, ej. 5 min"></div><div class="field"><label>Temperatura (°C), si aplica</label><input id="sanTemp" type="number" step="any" placeholder="Temperatura de aplicación"></div><div class="field"><label>¿Requiere enjuague posterior?</label><select id="sanRinse"><option>No especificado / verificar etiqueta</option><option>Sí</option><option>No, según etiqueta</option></select></div><div class="field"><label>Verificación de concentración / resultado</label><input id="sanVerify" placeholder="Ej. tira reactiva: lectura y unidad"></div><div class="field"><label>Responsable</label><input id="sanOperator" placeholder="Iniciales o nombre"></div><div class="field"><label>Observaciones / desviaciones</label><textarea id="sanObs" rows="2" placeholder="Estado de superficie, acción correctiva, etc."></textarea></div><button class="btn" onclick="saveSanitation()">Guardar registro de saneamiento</button><p class="note">Complete los campos según el procedimiento SSOP/POES y la etiqueta del producto. Este formulario no determina por sí solo que la operación haya sido eficaz.</p></div>
<h3>Análisis guardados (${data.length})</h3>${data.length?data.slice().reverse().map(r=>`<div class="item"><b>${esc(r.sample)}</b> · ${esc(r.param)}: <b>${esc(r.value)}</b><p>Lote: ${esc(r.lot||'No indicado')} · ${esc(r.date)}</p><p>${esc(r.obs||'')}</p></div>`).join(''):'<p class="muted">Todavía no hay análisis registrados.</p>'}
<h3>Operaciones de saneamiento (${san.length})</h3>${san.length?san.slice().reverse().map(r=>`<div class="item"><b>${esc(r.equipment)}</b> · ${esc(r.type)}<p>${esc(r.product)} · ${esc(r.conc||'Concentración no indicada')} · ${esc(r.date)}</p><p>Contacto: ${esc(r.time||'No indicado')} · Verificación: ${esc(r.verify||'No registrada')}</p></div>`).join(''):'<p class="muted">Todavía no hay operaciones de saneamiento registradas.</p>'}<div class="btn-row"><button class="btn secondary" onclick="exportRecords()">Exportar análisis CSV</button><button class="btn secondary" onclick="exportSanitation()">Exportar saneamiento CSV</button><button class="btn secondary" onclick="clearSanitation()">Borrar saneamiento</button><button class="btn secondary" onclick="clearRecords()">Borrar análisis</button></div><p class="note">El almacenamiento local no equivale a un sistema validado de registros ni garantiza respaldo automático. Exporte copias periódicamente.</p>`}
function saveRecord(){let r={sample:document.getElementById('sample').value.trim(),lot:document.getElementById('lot').value.trim(),param:document.getElementById('param').value,value:document.getElementById('value').value.trim(),obs:document.getElementById('obs').value.trim(),date:new Date().toLocaleString('es-EC')};if(!r.sample||!r.value)return alert('Complete muestra y resultado.');let d=JSON.parse(localStorage.getItem(recordsKey)||'[]');d.push(r);localStorage.setItem(recordsKey,JSON.stringify(d));openTab('records')}
function saveSanitation(){let r={equipment:document.getElementById('sanEquipment').value.trim(),type:document.getElementById('sanType').value,product:document.getElementById('sanProduct').value.trim(),lot:document.getElementById('sanLot').value.trim(),conc:document.getElementById('sanConc').value.trim(),qty:document.getElementById('sanQty').value.trim(),time:document.getElementById('sanTime').value.trim(),temp:document.getElementById('sanTemp').value.trim(),rinse:document.getElementById('sanRinse').value,verify:document.getElementById('sanVerify').value.trim(),operator:document.getElementById('sanOperator').value.trim(),obs:document.getElementById('sanObs').value.trim(),date:new Date().toLocaleString('es-EC')};if(!r.equipment||!r.product||!r.conc)return alert('Complete al menos equipo/área, producto químico y concentración.');let d=JSON.parse(localStorage.getItem(sanitationKey)||'[]');d.push(r);localStorage.setItem(sanitationKey,JSON.stringify(d));openTab('records')}
function exportSanitation(){let d=JSON.parse(localStorage.getItem(sanitationKey)||'[]');if(!d.length)return alert('No hay registros de saneamiento.');let keys=['date','equipment','type','product','lot','conc','qty','time','temp','rinse','verify','operator','obs'];let labels=['Fecha','Equipo/área','Operación','Producto químico','Lote químico','Concentración','Cantidad preparada','Tiempo contacto','Temperatura °C','Enjuague','Verificación','Responsable','Observaciones'];let rows=[labels,...d.map(r=>keys.map(k=>r[k]||''))];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='food-quality-saneamiento.csv';a.click();URL.revokeObjectURL(a.href)}
function clearSanitation(){if(confirm('¿Borrar todos los registros de saneamiento de este dispositivo?')){localStorage.removeItem(sanitationKey);openTab('records')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function exportRecords(){let d=JSON.parse(localStorage.getItem(recordsKey)||'[]');if(!d.length)return alert('No hay registros.');let rows=[['Muestra','Lote','Parámetro','Resultado','Observaciones','Fecha'],...d.map(r=>[r.sample,r.lot,r.param,r.value,r.obs,r.date])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='food-quality-registros.csv';a.click();URL.revokeObjectURL(a.href)}
function clearRecords(){if(confirm('¿Borrar todos los registros de este dispositivo?')){localStorage.removeItem(recordsKey);openTab('records')}}
function openTab(tab){current=tab;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));view.innerHTML=tab==='home'?home():tab==='library'?library():tab==='tools'?tools():tab==='records'?records():industries();window.scrollTo(0,0)}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));
document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.trim().toLowerCase();if(!q){if(current==='search')openTab('home');return}let found=topics.filter(t=>(t.title+' '+t.cat+' '+t.desc+' '+t.body.replace(/<[^>]*>/g,' ')).toLowerCase().includes(q));current='search';document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));view.innerHTML=`<button class="back" onclick="openTab('home')">← Inicio</button><div class="eyebrow">Búsqueda</div><h2>Resultados</h2>${found.length?found.map(t=>`<button class="item" style="width:100%;text-align:left" onclick="showTopic('${t.id}')"><h3>${t.title}</h3><p>${t.desc}</p></button>`).join(''):'<p class="muted">No se encontraron coincidencias en el contenido disponible.</p>'}`});
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});openTab('home');
</script></body></html>
